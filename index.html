<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2329">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>레코드룸 — 내 노래를 커버·LP·테이프로</title>
<style>
:root{--bg:#1f2329;--fg:#eef1f4;--sub:rgba(238,241,244,.62);--track:rgba(238,241,244,.22);--accent:#9fb4c7;--c1:#33414f;--c2:#4f677d;--c3:#7f98ae;--c4:#b9c9d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color 1.2s ease}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* 앰비언트 — 대표색이 아닌 나머지 색이 은은하게 흐른다 */
#amb{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(80px);opacity:.5}
#amb i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.5;transition:background-color 1.6s ease}
#amb i:nth-child(1){background:var(--c1);left:0;top:0;animation:a1 26s ease-in-out infinite alternate}
#amb i:nth-child(2){background:var(--c2);right:0;top:10%;animation:a2 31s ease-in-out infinite alternate}
#amb i:nth-child(3){background:var(--c3);left:10%;bottom:0;animation:a3 29s ease-in-out infinite alternate}
#amb i:nth-child(4){background:var(--c4);right:5%;bottom:5%;animation:a4 35s ease-in-out infinite alternate;opacity:.35}
@keyframes a1{to{transform:translate(22vmax,18vmax) scale(1.2)}}
@keyframes a2{to{transform:translate(-20vmax,22vmax) scale(.85)}}
@keyframes a3{to{transform:translate(18vmax,-20vmax) scale(1.15)}}
@keyframes a4{to{transform:translate(-24vmax,-14vmax) scale(.9)}}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);position:relative;transition:transform .15s,color .3s}
.ib:active{transform:scale(.9)}
.ib svg{width:24px;height:24px}
#bOrder,#bRepeat{color:var(--sub)}
.ib.on,#bOrder.on,#bRepeat.on{color:var(--accent)}
.ib.on::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.ib .one{position:absolute;font-size:9px;font-weight:800;top:13px;left:50%;transform:translateX(-50%)}
.modes{display:flex;background:color-mix(in srgb,var(--fg) 10%,transparent);border-radius:99px;padding:3px}
.modes button{color:var(--sub);font-size:14px;font-weight:600;padding:8px 15px;border-radius:99px;transition:background .3s,color .3s}
.modes button.on{background:var(--fg);color:var(--bg)}
.stage{margin:20px -6px 14px;aspect-ratio:1/1;position:relative}
#art{width:100%;height:100%;display:block}
.meta{min-height:58px}
.title{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:var(--sub);font-size:15px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{margin-top:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--fg) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--fg)}
.time{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.ctrls .big{width:72px;height:72px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:transform .15s,background .6s,color .6s}
.ctrls .big:active{transform:scale(.93)}
.ctrls .big svg{width:30px;height:30px}
.ctrls .mid svg{width:30px;height:30px}
.row{display:flex;gap:10px;margin-top:16px}
.vol{display:flex;align-items:center;gap:12px;margin-top:14px;color:var(--sub)}.vol svg{width:20px;height:20px;flex:none}.vol input{height:18px}
.chip{flex:1;border-radius:14px;padding:13px 10px;font-size:14px;font-weight:600;background:color-mix(in srgb,var(--fg) 10%,transparent);color:var(--fg);transition:transform .15s}
.chip:active{transform:scale(.97)}
/* 아래에서 올라오는 판 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:480px;margin:0 auto;background:color-mix(in srgb,var(--bg) 88%,#fff 12%);border-radius:24px 24px 0 0;padding:10px 20px max(20px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:78vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--track);margin:0 auto 14px}
.sheet h3{font-size:17px;margin-bottom:12px}
.lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.lh h3{margin:0}.lh .btn{padding:8px 14px;font-size:14px}
.sheet p.hint{font-size:13px;color:var(--sub);line-height:1.6;margin-top:8px}
.sheet ul.hint{font-size:13px;color:var(--sub);line-height:1.7;margin-top:10px;padding-left:1.2em}.sheet ul.hint b{color:var(--fg);font-weight:600}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;border:0;border-radius:12px;padding:13px 14px;font:inherit;font-size:15px;background:color-mix(in srgb,var(--fg) 10%,transparent);color:var(--fg);outline:none}
.field input::placeholder{color:var(--sub)}
.btn{border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--fg);color:var(--bg)}
.btn.ghost{background:color-mix(in srgb,var(--fg) 10%,transparent);color:var(--fg)}
.sep{height:1px;background:var(--track);margin:18px 0}
.list{list-style:none}
.list li{display:flex;align-items:center;gap:12px;padding:8px 0;border-radius:12px;cursor:pointer}
.list li.cur .lt{color:var(--accent)}
.list img,.list .ph{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:var(--track)}
.list .lx{flex:1;min-width:0}
.list .lt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .la{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list li.blocked{opacity:.4}
.list .del{width:36px;height:36px;color:var(--sub)}
.fmt{display:flex;gap:8px;margin-bottom:12px}
.fmt button{flex:1;border-radius:12px;padding:12px;font-weight:600;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.fmt button.on{background:var(--fg);color:var(--bg)}
.fmt button:disabled{opacity:.35;cursor:not-allowed}
#preview{width:100%;border-radius:14px;margin-top:12px;display:none}
.prog{height:4px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:12px;display:none}.prog i{display:block;height:100%;width:0;background:var(--fg)}
#scrim{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:9;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ytbox{position:fixed;left:-480px;top:0;width:240px;height:135px}   /* 소리만 쓴다 — 화면 밖 */
</style>
</head>
<body>
<div id="amb"><i></i><i></i><i></i><i></i></div>
<main>
  <div class="top">
    <button class="ib" id="bList" aria-label="재생 목록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <div class="modes" id="modes"><button data-m="cover">커버</button><button data-m="lp">LP</button><button data-m="tape">테이프</button></div>
    <button class="ib" id="bAdd" aria-label="노래 넣기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="stage"><canvas id="art"></canvas></div>
  <div class="meta"><div class="title" id="tTitle">레코드룸</div><div class="artist" id="tArtist">오른쪽 위 ＋ 버튼 또는 재생 버튼</div></div>
  <div class="seek"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치"><div class="time"><span id="tCur">0:00</span><span id="tDur">0:00</span></div></div>
  <div class="ctrls">
    <button class="ib" id="bOrder" aria-label="재생 순서"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="ib mid" id="bPrev" aria-label="이전"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="big" id="bPlay" aria-label="재생"><svg viewBox="0 0 24 24" fill="currentColor" id="iPlay"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ib mid" id="bNext" aria-label="다음"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="ib" id="bRepeat" aria-label="반복"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg><span class="one" id="iOne" hidden>1</span></button>
  </div>
  <div class="vol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" id="vol" min="0" max="100" value="50" aria-label="소리 크기"></div>
  <div class="row"><button class="chip" id="bShuffleNow">지금 섞기</button><button class="chip" id="bSave">움직이는 카드 저장</button></div>
</main>

<div id="scrim"></div>
<section class="sheet" id="sAdd">
  <div class="grab"></div><h3>노래 넣기</h3>
  <div class="field"><input id="url" placeholder="유튜브 영상·재생목록 주소" inputmode="url" autocomplete="off"><button class="btn" id="bUrl">넣기</button></div>
  <ul class="hint"><li>재생목록 주소(list=…) → 통째로 추가</li><li>커버·색 → 영상 썸네일에서</li><li>다른 사이트 재생 금지 영상 → 건너뜀</li><li><b>"… - Topic"</b> 자동 음원 → 몇 초 뒤 멈춤, 공식 MV 권장</li></ul>
  <div class="sep"></div>
  <button class="btn ghost" id="bFile" style="width:100%">MP3 파일 넣기</button>
  <input type="file" id="file" accept="audio/*,.mp3,.m4a" multiple hidden>
  <p class="hint">파일 안에 든 커버 그림과 제목을 읽습니다. 파일은 이 기기를 벗어나지 않습니다.</p>
</section>
<section class="sheet" id="sList"><div class="grab"></div><div class="lh"><h3>재생 목록</h3><button class="btn ghost" id="bClear">모두 지우기</button></div><ul class="list" id="list"></ul></section>
<section class="sheet" id="sSave">
  <div class="grab"></div><h3>움직이는 카드</h3>
  <div class="fmt" id="fmt"><button data-f="webp">WebP · 고화질 저용량</button><button data-f="gif">GIF</button></div>
  <button class="btn" id="bMake" style="width:100%">지금 화면으로 만들기 (4초)</button>
  <div class="prog" id="prog"><i></i></div>
  <img id="preview" alt="">
  <div class="row" id="outRow" style="display:none"><button class="chip" id="bShare">공유하기</button><button class="chip" id="bDown">저장하기</button></div>
  <p class="hint" id="fmtHint"></p>
</section>
<div id="toast"></div>
<div id="ytbox"><div id="yt"></div><div id="ytprobe"></div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const toast = (m, ms = 2400) => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); };
const store = { get(k, d) { try { const v = localStorage.getItem('rr-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('rr-' + k, JSON.stringify(v)); } catch (e) {} } };
const fmtT = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ═══ 색 뽑기 — trackpic(pic-kn/trackpic)과 같은 절차: 가운데 70% · MMCQ 25색 · 주색 색상 ±0.15 또는 채도<0.2 · 밝기순 5색 ═══ */
const lumOf = (r, g, b) => .2126 * r + .7152 * g + .0722 * b;
function rgb2hsl(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; if (mx === mn) return { h: 0, s: 0, l }; const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; return { h: h / 6, s, l }; }
function hsl2rgb(h, s, l) { if (!s) return [l * 255, l * 255, l * 255].map(Math.round); const f = (p, q, t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; }; const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q; return [f(p, q, h + 1 / 3), f(p, q, h), f(p, q, h - 1 / 3)].map(v => Math.round(v * 255)); }
const hex = (r, g, b) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
function mmcq(pixels, maxColors) {           // 5비트 히스토그램 + 중앙값 자르기
  const histo = new Uint32Array(32768); let r1 = 31, r2 = 0, g1 = 31, g2 = 0, b1 = 31, b2 = 0;
  for (const [r, g, b] of pixels) { const R = r >> 3, G = g >> 3, B = b >> 3; histo[(R << 10) | (G << 5) | B]++; r1 = Math.min(r1, R); r2 = Math.max(r2, R); g1 = Math.min(g1, G); g2 = Math.max(g2, G); b1 = Math.min(b1, B); b2 = Math.max(b2, B); }
  const box = (a) => { const o = { a }; o.count = () => { if (o._c != null) return o._c; let n = 0; const [ra, rb, ga, gb, ba, bb] = a; for (let r = ra; r <= rb; r++) for (let g = ga; g <= gb; g++) for (let b = ba; b <= bb; b++) n += histo[(r << 10) | (g << 5) | b]; return (o._c = n); };
    o.avg = () => { let n = 0, rs = 0, gs = 0, bs = 0; const [ra, rb, ga, gb, ba, bb] = a; for (let r = ra; r <= rb; r++) for (let g = ga; g <= gb; g++) for (let b = ba; b <= bb; b++) { const h = histo[(r << 10) | (g << 5) | b]; n += h; rs += h * (r + .5) * 8; gs += h * (g + .5) * 8; bs += h * (b + .5) * 8; } return n ? [rs / n, gs / n, bs / n].map(Math.round) : [(ra + rb + 1) * 4, (ga + gb + 1) * 4, (ba + bb + 1) * 4]; }; return o; };
  const boxes = [box([r1, r2, g1, g2, b1, b2])];
  for (let it = 0; boxes.length < maxColors && it < Math.max(100, maxColors * 3); it++) {
    boxes.sort((x, y) => y.count() - x.count()); const t = boxes.shift(); if (!t.count()) { boxes.push(t); break; }
    const [ra, rb, ga, gb, ba, bb] = t.a, w = [rb - ra, gb - ga, bb - ba], ax = w.indexOf(Math.max(...w));
    const lo = t.a[ax * 2], hi = t.a[ax * 2 + 1]; if (lo === hi) { boxes.push(t); break; }
    let tot = 0; const part = {};
    for (let v = lo; v <= hi; v++) { const a = t.a.slice(); a[ax * 2] = a[ax * 2 + 1] = v; tot += box(a).count(); part[v] = tot; }
    let cut = lo; for (let v = lo; v <= hi; v++) if (part[v] >= tot / 2) { cut = v; break; } if (cut === hi) cut = hi - 1;
    const A = t.a.slice(), B = t.a.slice(); A[ax * 2 + 1] = cut; B[ax * 2] = cut + 1;
    const ba_ = box(A), bb_ = box(B); let added = false; if (ba_.count()) { boxes.push(ba_); added = true; } if (bb_.count()) { boxes.push(bb_); added = true; } if (!added) { boxes.push(t); break; }
  }
  return boxes.sort((x, y) => y.count() - x.count()).map(b => b.avg());
}
function extractPalette(src) {               // src: {img, sx, sy, sw, sh}
  const cw = Math.max(10, Math.round(src.sw * .7)), ch = Math.max(10, Math.round(src.sh * .7));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch; const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src.img, src.sx + (src.sw - cw) / 2, src.sy + (src.sh - ch) / 2, cw, ch, 0, 0, cw, ch);
  let d; try { d = x.getImageData(0, 0, cw, ch).data; } catch (e) { return null; }
  const px = []; for (let i = 0; i < d.length; i += 16) if (d[i + 3] >= 125) px.push([d[i], d[i + 1], d[i + 2]]);
  if (!px.length) return null;
  const raw = mmcq(px, 25); const dom = rgb2hsl(...raw[0]).h;
  const hd = (a, b) => { const v = Math.abs(a - b); return Math.min(v, 1 - v); };
  const mapped = raw.map(([r, g, b]) => { const { h, s } = rgb2hsl(r, g, b); return { r, g, b, h, s, lum: lumOf(r, g, b) }; });
  const inR = mapped.filter(c => c.s < .2 || hd(c.h, dom) <= .15), cand = (inR.length >= 5 ? inR : mapped).sort((a, b) => a.lum - b.lum);
  const pick = m => { const out = [cand[0]]; for (const c of cand.slice(1)) if (out.every(p => Math.abs(p.lum - c.lum) >= m)) { out.push(c); if (out.length === 5) break; } return out; };
  let p; for (const m of [25, 15, 8, 5, 3]) { p = pick(m); if (p.length >= 5) break; }
  const base = p[0], { h, s, l } = rgb2hsl(base.r, base.g, base.b);
  while (p.length < 5) { const [r, g, b] = hsl2rgb(h, Math.max(.1, s), Math.max(.1, Math.min(.9, l + p.length * .16 - .32))); p.push({ r, g, b, h, s, lum: lumOf(r, g, b) }); }
  return p.sort((a, b) => a.lum - b.lum).slice(0, 5).map(c => ({ ...c, hex: hex(c.r, c.g, c.b) }));
}
let PAL = null;
const relLum = (r, g, b) => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }; return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
